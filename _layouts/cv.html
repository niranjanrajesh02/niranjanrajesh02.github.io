---
layout: default
---
<!-- _layouts/cv.html -->
{%- assign cv_url = page.cv_pdf | prepend: '/assets/pdf/' | relative_url -%}
<div class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }} <a href="{{ cv_url }}" target="_blank" rel="noopener noreferrer" class="float-right" title="Download CV (PDF)"><i class="fas fa-file-pdf"></i></a></h1>
    <p class="post-description">{{ page.description }}</p>
  </header>

  <iframe class="cv-frame" src="{{ cv_url }}#toolbar=0" title="Curriculum Vitae of {{ site.first_name }} {{ site.last_name }}"></iframe>

  <p class="cv-links">
    <a href="{{ cv_url }}" target="_blank" rel="noopener noreferrer">Download CV (PDF)</a>
    {%- if page.resume_pdf %}
    &nbsp;·&nbsp; Prefer something shorter? <a href="{{ page.resume_pdf | prepend: '/assets/pdf/' | relative_url }}" target="_blank" rel="noopener noreferrer">View my 1-page résumé (PDF)</a>
    {%- endif %}
  </p>
  {{ content }}
</div>
